<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" role="img" aria-labelledby="drTitle">
  <title id="drTitle">Multi-region disaster recovery</title>
  <rect width="640" height="220" rx="16" fill="#FFFFFF" stroke="#E4EAF1"/>
  <text x="24" y="32" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.1em">DISASTER RECOVERY</text>

  <rect x="40" y="52" width="220" height="140" rx="14" fill="#F8FAFC" stroke="#04275F" stroke-width="1.75"/>
  <text x="60" y="78" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="0.08em">REGION A - ACTIVE</text>
  <text x="60" y="106" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Primary estate</text>
  <rect x="60" y="122" width="180" height="24" rx="6" fill="#D9EAF8"/>
  <text x="72" y="139" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">Compute / data / identity</text>
  <text x="60" y="172" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">RPO / RTO owned</text>

  <rect x="380" y="52" width="220" height="140" rx="14" fill="#D9EAF8" stroke="#438BD8" stroke-width="1.75"/>
  <text x="400" y="78" fill="#438BD8" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="0.08em">REGION B - STANDBY</text>
  <text x="400" y="106" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Warm secondary</text>
  <rect x="400" y="122" width="180" height="24" rx="6" fill="#FFFFFF"/>
  <text x="412" y="139" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">Replicated data plane</text>
  <text x="400" y="172" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">Failover tested</text>

  <path d="M260 100H380" stroke="#F26A13" stroke-width="2.25"/>
  <path d="M380 140H260" stroke="#04275F" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <text x="320" y="90" text-anchor="middle" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">replicate</text>
  <text x="320" y="162" text-anchor="middle" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">failover</text>
</svg>
