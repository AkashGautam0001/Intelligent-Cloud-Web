<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" role="img" aria-labelledby="stTitle">
  <title id="stTitle">Cloud storage lifecycle tiers</title>
  <rect width="640" height="220" rx="16" fill="#FFFFFF" stroke="#E4EAF1"/>
  <text x="24" y="32" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.1em">STORAGE LIFECYCLE</text>

  <rect x="40" y="52" width="560" height="40" rx="10" fill="#FFF7F0" stroke="#F26A13" stroke-width="1.75"/>
  <text x="56" y="70" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">TIER 1</text>
  <text x="56" y="84" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Hot - frequent access / SSD</text>

  <rect x="80" y="108" width="480" height="40" rx="10" fill="#D9EAF8" stroke="#438BD8" stroke-width="1.75"/>
  <text x="96" y="126" fill="#438BD8" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">TIER 2</text>
  <text x="96" y="140" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Cool - infrequent / lower cost</text>

  <rect x="120" y="164" width="400" height="40" rx="10" fill="#F8FAFC" stroke="#04275F" stroke-width="1.75"/>
  <text x="136" y="182" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">TIER 3</text>
  <text x="136" y="196" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Archive - retention / immutability</text>

  <path d="M320 92V108M320 148V164" stroke="#F26A13" stroke-width="1.75" stroke-opacity="0.7"/>
</svg>
