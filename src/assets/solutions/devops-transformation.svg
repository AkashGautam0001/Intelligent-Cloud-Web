<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" role="img" aria-labelledby="dvTitle">
  <title id="dvTitle">DevOps and GitOps delivery path</title>
  <rect width="640" height="220" rx="16" fill="#FFFFFF" stroke="#E4EAF1"/>
  <text x="24" y="32" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.1em">DELIVERY PATH / GITOPS</text>

  <rect x="32" y="70" width="120" height="90" rx="12" fill="#F8FAFC" stroke="#04275F" stroke-width="1.75"/>
  <text x="48" y="98" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">01</text>
  <text x="48" y="122" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Build</text>
  <text x="48" y="144" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">CI / tests</text>

  <rect x="184" y="70" width="120" height="90" rx="12" fill="#D9EAF8" stroke="#438BD8" stroke-width="1.75"/>
  <text x="200" y="98" fill="#438BD8" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">02</text>
  <text x="200" y="122" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Gate</text>
  <text x="200" y="144" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">Policy / scan</text>

  <rect x="336" y="70" width="120" height="90" rx="12" fill="#FFF7F0" stroke="#F26A13" stroke-width="1.75"/>
  <text x="352" y="98" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">03</text>
  <text x="352" y="122" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Deploy</text>
  <text x="352" y="144" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">Argo / Flux</text>

  <rect x="488" y="70" width="120" height="90" rx="12" fill="#FFFFFF" stroke="#04275F" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="504" y="98" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">RUN</text>
  <text x="504" y="122" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Prod</text>
  <text x="504" y="144" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12">Desired state</text>

  <path d="M152 115H184M304 115H336M456 115H488" stroke="#04275F" stroke-width="1.75" stroke-opacity="0.45"/>
  <text x="24" y="200" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">TRUNK-BASED / OIDC / PROMOTION GATES</text>
</svg>
